<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #313338;
      color: #dbdee1;
      font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .discord-message {
      background: #313338;
      padding: 0 12px;
      min-width: 400px;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .message-container {
      display: flex;
      align-items: flex-start;
      position: relative;
      padding: 12px 0;
      min-height: 44px;
    }

    .message-container.has-reply {
      align-items: flex-start;
    }

    .message-container.has-reply .avatar {
      margin-top: 22px;
    }

    .message-container:not(.has-reply) .avatar {
      margin-top: 0px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 16px;
      flex-shrink: 0;
      margin-top: 0px;
      margin-bottom: 3px;
      box-sizing: border-box;
      padding: 0;
      background: #313338;
      position: relative;
      z-index: 2;
    }

    .content-wrapper {
      flex: 1;
      min-width: 0;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .username {
      font-weight: 500;
      font-size: 16px;
      color: var(--user-color, #dbdee1);
      line-height: 1.375;
    }

    .role-icon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      object-fit: contain;
      margin-left: 2px;
      margin-right: 2px;
      vertical-align: middle;
    }

    .timestamp {
      font-size: 12px;
      color: #949ba4;
      font-weight: 400;
      margin-left: 6px;
      line-height: 1.375;
    }

    .content {
      font-size: 16px;
      line-height: 1.375;
      color: #dbdee1;
      word-break: break-word;
      white-space: pre-line;
      margin-bottom: 2px;
    }

    .emoji {
      vertical-align: -0.2em;
      object-fit: contain;
    }

    .reply-emoji {
      width: 16px;
      height: 16px;
      vertical-align: -0.1em;
    }

    .text-emoji {
      width: 18px;
      height: 18px;
      vertical-align: -0.2em;
    }

    .large-emoji {
      width: 45px;
      height: 45px;
      vertical-align: -0.3em;
      margin: 2px;
    }

    .direct-image-container {
      margin: 4px 0;
      display: block;
    }

    .direct-image {
      max-width: 400px;
      max-height: 300px;
      border-radius: 8px;
      object-fit: contain;
      display: block;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .reply-wrapper {
      position: relative;
      margin-bottom: 4px;
      margin-left: 0px;
    }

    .reply-spine-container {
      position: absolute;
      left: 16px;
      top: 16px;
      width: 24px;
      height: 10px;
      z-index: 1;
      pointer-events: none;
    }

    .reply-spine {
      width: 100%;
      height: 100%;
      border-top: 2px solid #4e5058;
      border-right: 2px solid #4e5058;
      border-top-right-radius: 6px;
      background: transparent;
      transform: rotate(180deg) scaleY(-1);
    }

    .reply-container {
      display: flex;
      align-items: center;
      padding-left: 0px;
      position: relative;
      z-index: 2;
    }

    .reply-spine::before {
      display: none;
    }

    .reply-avatar {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      object-fit: cover;
      margin-left: 0px;
      margin-right: 8px;
    }

    .reply-content {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 4px;
    }

    .reply-author {
      font-size: 13px;
      font-weight: 600;
      color: #b5bac1;
      flex-shrink: 0;
    }

    .reply-text {
      font-size: 13px;
      color: #b5bac1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .attachments {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 0px;
      max-width: 800px;
    }

    .attachment-item {
      border-radius: 8px;
      overflow: hidden;
      background: transparent;
      position: relative;
    }

    .attachment-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      border-radius: 8px;
      background: transparent;
      aspect-ratio: 1/1;
    }

    .attachment-video {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      background: #232428;
      object-fit: contain;
    }

    /* Grid Layouts - All Square */
    .grid-1 .single {
      max-width: 400px;
      max-height: 400px;
      aspect-ratio: 1/1;
    }

    .grid-2 {
      display: flex;
      gap: 2px;
      height: 200px;
    }

    .grid-2 .half {
      height: 100%;
      aspect-ratio: 1/1;
    }

    .grid-3 {
      display: flex;
      gap: 2px;
      height: 200px;
    }

    .grid-3 .left-big {
      height: 100%;
    }

    .grid-3 .right-small {
      display: flex;
      flex-direction: column;
      gap: 2px;
      height: 100%;
    }

    .grid-3 .big {
      height: 100%;
      aspect-ratio: 1/1;
    }

    .grid-3 .small {
      height: calc(50% - 1px);
      aspect-ratio: 1/1;
    }

    .grid-4 {
      display: flex;
      gap: 2px;
      height: 200px;
    }

    .grid-4 .left-column, .grid-4 .right-column {
      display: flex;
      flex-direction: column;
      gap: 2px;
      height: 100%;
    }

    .grid-4 .quarter {
      height: calc(50% - 1px);
      aspect-ratio: 1/1;
    }

    .grid-5 {
      display: flex;
      flex-direction: column;
      gap: 0px;
    }

    .grid-5 .top-row {
      display: flex;
      gap: 2px;
      height: 150px;
    }

    .grid-5 .bottom-row {
      display: flex;
      gap: 2px;
      height: 100px;
    }

    .grid-5 .half {
      height: 100%;
      aspect-ratio: 1/1;
    }

    .grid-5 .third {
      height: 100%;
      aspect-ratio: 1/1;
    }

    .grid-6 {
      display: flex;
      flex-direction: column;
      gap: 0px;
    }

    .grid-6 .top-row, .grid-6 .bottom-row {
      display: flex;
      gap: 2px;
      height: 120px;
    }

    .grid-6 .third {
      height: 100%;
      aspect-ratio: 1/1;
    }

    .grid-7 {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .grid-7 .top-big {
      height: 200px;
      width: 100%;
    }

    .grid-7 .big-top {
      width: 100%;
      height: 200px;
      object-fit: cover;
      aspect-ratio: auto;
    }

    .grid-7 .middle-row {
		  flex: 1;
      display: flex;
      gap: 2px;
      height: 80px;
    }

    .grid-7 .bottom-row {
      flex: 1;
      display: flex;
      gap: 2px;
      height: 80px;
    }

    .grid-7 .third {
      height: 100%;
      aspect-ratio: 1/1;
    }

    .grid-8 {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .grid-8 .top-row {
      flex: 1;
      display: flex;
      gap: 2px;
      height: 150px;
    }

    .grid-8 .middle-row {
      flex: 1;
      display: flex;
      gap: 2px;
      height: 80px;
    }

    .grid-8 .bottom-row {
      flex: 1;
      display: flex;
      gap: 2px;
      height: 80px;
    }

    .grid-8 .half {
      flex: 1;
      height: 100%;
      aspect-ratio: 1/1;
    }

    .grid-8 .third {
      flex: 1;
      height: 100%;
      aspect-ratio: 1/1;
    }

    .grid-9 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .grid-9 .ninth {
      height: 100%;
      aspect-ratio: 1/1;
    }

    .grid-10 {
      display: flex;
      flex-direction: column;
      gap: 0px;
    }

    .grid-10 .top-big {
      height: 200px;
      aspect-ratio: 1/1;
    }

    .grid-10 .bottom-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .grid-10 .ninth {
      height: 100%;
      aspect-ratio: 1/1;
    }

    .more-overlay {
      position: relative;
    }

    .more-count {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 14px;
    }

    .file-attachment {
      background: #232428;
      border-radius: 8px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 60px;
    }

    .file-icon {
      font-size: 24px;
    }

    .file-name {
      color: #00aff4;
      font-weight: 500;
      font-size: 15px;
    }

    .file-size {
      color: #949ba4;
      font-size: 12px;
    }

    .mention {
      background: rgba(88, 101, 242, 0.3);
      color: #dee0fc;
      padding: 0 2px;
      border-radius: 3px;
      font-weight: 500;
    }

    .subtext {
      font-size: 14px;
      color: #b5bac1;
      line-height: 1.375;
    }

    .user-mention {
      background: rgba(88, 101, 242, 0.3);
      color: #dee0fc;
    }

    .channel-mention {
      background: rgba(88, 101, 242, 0.3);
      color: #dee0fc;
    }

    .role-mention {
      background: rgba(88, 101, 242, 0.3);
      color: #dee0fc;
    }

    .code-block {
      background: #2b2d31;
      border: 1px solid #1e1f22;
      border-radius: 4px;
      padding: 8px;
      margin: 8px 0;
      overflow-x: auto;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.125;
      color: #dbdee1;
    }

    .inline-code {
      background: #1e1f22;
      color: #dbdee1;
      padding: 2px 4px;
      border-radius: 3px;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 14px;
    }

    .header-1 {
      font-size: 24px;
      font-weight: 600;
      margin: 16px 0 8px 0;
      color: #dbdee1;
      line-height: 1.25;
    }

    .header-2 {
      font-size: 20px;
      font-weight: 600;
      margin: 16px 0 8px 0;
      color: #dbdee1;
      line-height: 1.25;
    }

    .header-3 {
      font-size: 18px;
      font-weight: 600;
      margin: 16px 0 8px 0;
      color: #dbdee1;
      line-height: 1.25;
    }

    .header-4 {
      font-size: 16px;
      font-weight: 600;
      margin: 16px 0 8px 0;
      color: #dbdee1;
      line-height: 1.25;
    }

    .header-5 {
      font-size: 14px;
      font-weight: 600;
      margin: 16px 0 8px 0;
      color: #dbdee1;
      line-height: 1.25;
    }

    .header-6 {
      font-size: 12px;
      font-weight: 600;
      margin: 16px 0 8px 0;
      color: #dbdee1;
      line-height: 1.25;
    }

    .blockquote {
      border-left: 4px solid #4e5058;
      padding-left: 12px;
      margin: 8px 0;
      color: #b5bac1;
      font-style: italic;
    }

    .unordered-list, .ordered-list {
      margin: 8px 0;
      padding-left: 20px;
    }

    .list-item, .list-item-ordered {
      margin: 4px 0;
      color: #dbdee1;
    }

    .markdown-table {
      border-collapse: collapse;
      margin: 8px 0;
      background: #2b2d31;
      border-radius: 4px;
      overflow: hidden;
    }

    .table-row {
      border-bottom: 1px solid #1e1f22;
    }

    .table-cell {
      padding: 8px 12px;
      border-right: 1px solid #1e1f22;
      color: #dbdee1;
    }

    .horizontal-rule {
      border: none;
      border-top: 1px solid #4e5058;
      margin: 16px 0;
    }

    .bold {
      font-weight: 700;
    }

    .italic {
      font-style: italic;
    }

    .strikethrough {
      text-decoration: line-through;
    }

    .underline {
      text-decoration: underline;
    }

    .spoiler {
      background: #202225;
      color: #202225;
      border-radius: 3px;
      padding: 0 2px;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .spoiler:hover {
      background: #484b51;
      color: #dcddde;
    }

    .markdown-link {
      color: #00aff4;
      text-decoration: none;
    }

    .markdown-link:hover {
      text-decoration: underline;
    }

    .auto-link {
      color: #00aff4;
      text-decoration: none;
    }

    .auto-link:hover {
      text-decoration: underline;
    }

    .stickers {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sticker-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 160px;
    }

    .sticker {
      width: 160px;
      height: 160px;
      object-fit: contain;
      border-radius: 8px;
      background: transparent;
    }

    .sticker-name {
      font-size: 12px;
      color: #b5bac1;
      margin-top: 4px;
      text-align: center;
      word-break: break-word;
    }

    .discord-conversation {
      background: #313338;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 400px;
      max-width: 800px;
    }

    .discord-conversation .discord-message {
      padding: 0 12px;
      min-width: 0;
      max-width: none;
    }
  </style>
</head>
<body>
  <div class="discord-message">
    <div class="message-container ">
      
      <img src="https://cdn.discordapp.com/avatars/611987847641038851/22a5ea75f0b5835ea908bd80e380f066.webp" alt="Yankue (Taylor&#39;s Version)'s avatar" class="avatar" />
      <div class="content-wrapper">
        
        <div class="header">
          <span class="username" style="color: #2ecc71;">Yankue (Taylor&#39;s Version)</span>
          
          <span class="timestamp">11:17</span>
        </div>
        <div class="content">sizzling sausages</div>
        
        
      </div>
    </div>
  </div></body>
</html>
